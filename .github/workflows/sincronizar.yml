name: Sincronizar Imagen desde OneDrive

on:
  repository_dispatch:
    types: [nueva_imagen]

permissions:
  contents: write

jobs:
  descargar-imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Descargar imagen desde OneDrive
        run: |
          # Toma la URL y el nombre enviados en el evento (o usa un enlace fijo si configuraste un secreto)
          URL_IMAGEN="${{ github.event.client_payload.url || secrets.ONEDRIVE_URL }}"
          NOMBRE_ARCHIVO="${{ github.event.client_payload.nombre || 'imagen_nueva.jpg' }}"
          
          mkdir -p imagenes
          curl -L "$URL_IMAGEN" -o "imagenes/$NOMBRE_ARCHIVO"

      - name: Guardar imagen en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add imagenes/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Agregar imagen desde OneDrive" && git push)
