name: Recibir imagen desde SharePoint
on:
  repository_dispatch:
    types: [nueva_imagen]

permissions:
  contents: write

jobs:
  guardar-imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar imagen desde SharePoint
        env:
          NOMBRE: ${{ github.event.client_payload.nombre }}
          URL_SHAREPOINT: ${{ github.event.client_payload.url }}
        run: |
          # Convierte el enlace de vista de SharePoint en enlace de descarga directa
          URL_DESCARGA="${URL_SHAREPOINT}?download=1"
          curl -L -s "$URL_DESCARGA" -o "$NOMBRE"

      - name: Subir cambios a GitHub
        run: |
          git config user.name "Noticiero Bot"
          git config user.email "bot@noticiero.local"
          git add .
          git commit -m "Nueva imagen desde SharePoint" || exit 0
          git push
